name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD is missing."
            exit 1
          fi
          # Keystore is stored AES-256 encrypted in the repo; only the secret password unlocks it.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:KEYSTORE_PASSWORD
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" > /dev/null
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'airseries' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk AirSeries.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AirSeries-${{ github.run_number }}
          path: AirSeries.apk

      - name: Publish GitHub Release (OTA source)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AirSeries 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'AirSeries update' }}
          make_latest: true
          files: AirSeries.apk
